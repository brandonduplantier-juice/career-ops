  # -- NIH-funded university bioinformatics cores --
  - name: NIH-Funded University Bioinformatics Cores
    query: '"bioinformatics core" OR "genomics core" "research assistant" OR "data analyst" OR "bioinformatician" remote OR "remote eligible" NIH site:linkedin.com/jobs OR site:jobs.lever.co OR site:jobs.ashbyhq.com'
