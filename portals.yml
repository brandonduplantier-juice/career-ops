# Portal Scanner Configuration - Brandon Duplantier
# Tuned for: remote Data Analyst / Business Intelligence / Healthcare & Clinical Analyst roles
# Constraints: Fully remote only (no hybrid, no on-site) | No pay ceiling | Entry/Junior/Associate
#
# Strategy (3 levels):
#   1. Playwright -> careers_url of each company (real-time, reliable)
#   2. Greenhouse API -> structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)

# -- Title filter --
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- Core analyst titles (any industry) --
    - "Data Analyst"
    - "Business Intelligence Analyst"
    - "BI Analyst"
    - "Business Intelligence Developer"
    - "Analytics Analyst"
    - "Reporting Analyst"
    - "Data Quality Analyst"
    - "Insights Analyst"
    - "Decision Support Analyst"
    - "Operations Analyst"
    - "Marketing Analyst"
    - "Product Analyst"
    - "Financial Analyst"
    - "Research Analyst"
    - "Data Scientist"
    - "Junior Data Scientist"
    - "Data Visualization"
    - "Dashboard Developer"
    # -- Healthcare-weighted (domain edge) --
    - "Healthcare Data Analyst"
    - "Health Data Analyst"
    - "Clinical Data Analyst"
    - "Health Informatics"
    - "Health Analytics"
    - "Clinical Analytics"
    - "Population Health Analyst"
    - "Revenue Cycle Analyst"
    - "Revenue Cycle Data Analyst"
    - "Prior Authorization"
    - "Utilization Analyst"
    - "Payer Analyst"
    - "Claims Analyst"
    - "Public Health Analyst"
    - "Epidemiology Analyst"
    - "Bioinformatics Analyst"

  negative:
    # -- Wrong seniority (target is entry/junior/associate) --
    - "Director"
    - "Manager,"
    - "Senior Manager"
    - "VP "
    - "Vice President"
    - "Head of"
    - "Chief"
    - "Principal"
    - "Staff "
    - "Lead "
    - "Architect"
    # -- On-site / hybrid signals in title --
    - "On-site"
    - "Onsite"
    - "Hybrid"
    - "In-person"
    # -- Wrong tech stacks / engineering roles --
    - ".NET"
    - "Java Developer"
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby on Rails"
    - "Embedded"
    - "Firmware"
    - "DevOps"
    - "Site Reliability"
    - "Salesforce Admin"
    - "SAP "
    - "Mainframe"
    - "COBOL"
    # -- Non-analyst roles --
    - "Sales Representative"
    - "Account Executive"
    - "Recruiter"
    - "Nurse"
    - "Pharmacist"
    - "Physician"
    - "Technician"
    - "Wet Lab"
    - "Phlebotomist"

  seniority_boost:
    - "Junior"
    - "Entry"
    - "Entry-level"
    - "Associate"
    - "Analyst I"
    - "I "
    - "Remote"
    - "Part-time"
    - "Contract"

# -- Search queries --
# Remote data / BI / healthcare analyst focus.

search_queries:

  # -- Greenhouse --
  - name: Greenhouse - Data Analyst (remote)
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "data analyst" remote entry OR junior OR associate'
    enabled: true
  - name: Greenhouse - BI Analyst (remote)
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "business intelligence analyst" OR "BI analyst" remote'
    enabled: true
  - name: Greenhouse - Healthcare Data Analyst (remote)
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "healthcare data analyst" OR "clinical data analyst" OR "health analytics" remote'
    enabled: true

  # -- Ashby --
  - name: Ashby - Data / BI Analyst (remote)
    query: 'site:jobs.ashbyhq.com "data analyst" OR "business intelligence" OR "analytics analyst" remote entry OR junior OR associate'
    enabled: true
  - name: Ashby - Healthcare / Clinical Analyst (remote)
    query: 'site:jobs.ashbyhq.com "healthcare data analyst" OR "clinical data analyst" OR "population health" remote'
    enabled: true

  # -- Lever --
  - name: Lever - Data / BI Analyst (remote)
    query: 'site:jobs.lever.co "data analyst" OR "business intelligence analyst" OR "reporting analyst" remote junior OR associate'
    enabled: true
  - name: Lever - Healthcare Analytics (remote)
    query: 'site:jobs.lever.co "healthcare" OR "clinical" "data analyst" OR "analytics" remote'
    enabled: true

  # -- LinkedIn guest --
  - name: LinkedIn - Remote Data Analyst Entry/Junior
    query: '"data analyst" remote "entry level" OR junior OR associate site:linkedin.com/jobs'
    enabled: true
  - name: LinkedIn - Remote BI Analyst
    query: '"business intelligence analyst" OR "BI analyst" remote site:linkedin.com/jobs'
    enabled: true
  - name: LinkedIn - Remote Healthcare Data Analyst
    query: '"healthcare data analyst" OR "clinical data analyst" OR "health informatics analyst" remote site:linkedin.com/jobs'
    enabled: true
  - name: LinkedIn - Remote Revenue Cycle / Prior Auth Analyst
    query: '"revenue cycle" OR "prior authorization" analyst OR analytics remote site:linkedin.com/jobs'
    enabled: true
  - name: LinkedIn - Remote Reporting / Analytics Analyst
    query: '"reporting analyst" OR "analytics analyst" OR "data quality analyst" remote junior OR associate site:linkedin.com/jobs'
    enabled: true

  # -- Remote-focused boards --
  - name: RemoteOK - Data / Analytics
    query: 'site:remoteok.com "data analyst" OR "business intelligence" OR "analytics"'
    enabled: true
  - name: WeWorkRemotely - Data / Analytics
    query: 'site:weworkremotely.com "data analyst" OR "business intelligence" OR "analytics"'
    enabled: true
  - name: Himalayas - Data / BI Analyst Remote
    query: 'site:himalayas.app "data analyst" OR "business intelligence" OR "healthcare data" remote'
    enabled: true
  - name: Built In - Remote Data Analyst
    query: 'site:builtin.com "data analyst" OR "business intelligence analyst" remote'
    enabled: true

  # -- Government (telework-eligible) --
  - name: USAJobs - Health Data Analyst Remote
    query: 'site:usajobs.gov "data analyst" OR "health informatics" OR "public health analyst" remote OR telework GS-5 OR GS-7 OR GS-9 OR Pathways'
    enabled: true

  # -- [SECONDARY] Longevity / Bioinformatics / Biotech research track --
  # The agent treats [SECONDARY] sources as a separate, capped track (see modes/_profile.md).
  - name: '[SECONDARY] Greenhouse - Bioinformatics / Comp Bio (remote)'
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "bioinformatics" OR "computational biology" remote intern OR junior OR "research associate"'
    enabled: true
  - name: '[SECONDARY] Ashby / Lever - Longevity / Drug Discovery (remote)'
    query: 'site:jobs.ashbyhq.com OR site:jobs.lever.co "longevity" OR "aging" OR "drug discovery" OR "computational biology" remote intern OR junior'
    enabled: true
  - name: '[SECONDARY] LinkedIn - Bioinformatics / Computational Biology (remote)'
    query: '"bioinformatics" OR "computational biology" remote intern OR junior OR "research associate" site:linkedin.com/jobs'
    enabled: true
  - name: '[SECONDARY] LinkedIn - Longevity / Aging Research (remote)'
    query: '"longevity" OR "aging research" OR "geroscience" remote intern OR junior site:linkedin.com/jobs'
    enabled: true
  - name: '[SECONDARY] Computer Vision - Life Sciences (remote)'
    query: '"computer vision" "life sciences" OR "pathology" OR "biological imaging" remote intern OR junior site:linkedin.com/jobs'
    enabled: true

