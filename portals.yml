# Portal Scanner Configuration — Brandon Duplantier
# Tuned for: bioinformatics, computational biology, longevity research,
#             computer vision (life sciences), life sciences data engineering
# Constraints: Remote only | Max $49,000/yr | Intern/Part-time/Contract/Junior OK
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)

# -- Title filter --
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- Bioinformatics core --
    - "Bioinformatics"
    - "Bioinformatician"
    - "Computational Biology"
    - "Computational Biologist"
    - "Genomics"
    - "Genomicist"
    - "Sequencing"
    - "Omics"
    - "Proteomics"
    - "Transcriptomics"
    - "Epigenomics"
    - "Single-cell"
    - "scRNA"
    - "Metagenomics"
    - "Variant Analysis"
    - "Variant Calling"
    - "Pipeline Developer"
    # -- Longevity / Aging --
    - "Longevity"
    - "Aging"
    - "Ageing"
    - "Senescence"
    - "Lifespan"
    - "Geroscience"
    - "Healthspan"
    - "Rejuvenation"
    - "Epigenetic Reprogramming"
    # -- Life Sciences data / engineering --
    - "Life Sciences Data"
    - "Life Sciences Engineer"
    - "Biomedical Data"
    - "Biomedical Informatics"
    - "Clinical Bioinformatics"
    - "Research Data Engineer"
    - "Scientific Data"
    - "Biological Data"
    - "Drug Discovery Data"
    - "Cheminformatics"
    # -- Computer vision (bio) --
    - "Pathology AI"
    - "Digital Pathology"
    - "Cell Imaging"
    - "Medical Imaging"
    - "Histopathology"
    - "Microscopy"
    - "Image Analysis"
    - "Computer Vision" # kept broad — scanner narrows by company
    # -- Research roles --
    - "Research Intern"
    - "Research Associate"
    - "Research Analyst"
    - "Research Engineer"
    - "Research Scientist"
    - "Computational Research"
    - "Biosciences"
    - "Biotechnology"
    - "Biotech"
    - "Drug Discovery"
    - "Structural Biology"
    - "Protein Design"
    - "Protein Engineering"
    - "Synthetic Biology"
    - "Systems Biology"
    - "Population Genetics"
    - "Functional Genomics"
    - "CRISPR"
    - "NGS"
    # -- Health data / analytics / epidemiology (CRO, payer, government, clinical) --
    - "Health Data Analyst"
    - "Clinical Data Analyst"
    - "Data Analyst"
    - "Health Informatics"
    - "Biostatistics"
    - "Biostatistician"
    - "Epidemiologist"
    - "Public Health Analyst"
    - "Health Analytics"
    - "Clinical Analytics"
    - "Genomic Data"
    - "Informatics Analyst"
    - "Data Scientist"
    - "Research Analyst"

  negative:
    # -- Wet lab / bench science (dry lab computational only) --
    - "Wet Lab"
    - "Bench Scientist"
    - "Lab Technician"
    - "Laboratory Technician"
    - "Cell Culture Technician"
    - "Sample Collection"
    - "Sample Processing"
    - "Sample Preparation"
    - "PCR Technician"
    - "Bench Technician"
    - "Histotechnician"
    - "Histotechnologist"
    - "Phlebotomist"
    - "Animal Technician"
    - "Vivarium"
    # -- On-site signals in title --
    - "On-site Only"
    - "Fully On-site"
    - "In-person Only"
    # -- Irrelevant tech stacks --
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby on Rails"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
    - "DevOps"
    - "Marketing"
    - "Sales Representative"
    - "Account Executive"
    - "Recruiter"
    - "HR "
    - "Finance Manager"
    - "Accountant"
    - "Legal "
    - "Lawyer"
    - "Attorney"

  seniority_boost:
    # Not required but increase relevance signal
    - "Junior"
    - "Intern"
    - "Associate"
    - "Entry"
    - "Part-time"
    - "Contract"
    - "Freelance"

# -- Search queries --
# Bioinformatics / computational biology / longevity / life sciences focus.

search_queries:

  # -- Greenhouse: bioinformatics internships --
  - name: Greenhouse — Bioinformatics Intern (remote)
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "bioinformatics" intern OR internship remote'
    enabled: true

  - name: Greenhouse — Computational Biology (remote)
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "computational biology" OR "computational biologist" remote'
    enabled: true

  - name: Greenhouse — Genomics / Omics roles
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "genomics" OR "transcriptomics" OR "single-cell" intern OR "research associate" remote'
    enabled: true

  - name: Greenhouse — Longevity / Aging Research
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "longevity" OR "aging research" OR "geroscience" OR "senescence" intern OR junior remote'
    enabled: true

  - name: Greenhouse — Life Sciences Data Engineer
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "life sciences" "data engineer" OR "research data" intern OR junior remote'
    enabled: true

  # -- Ashby: bioinformatics and life sciences --
  - name: Ashby — Bioinformatics / Comp Bio (remote)
    query: 'site:jobs.ashbyhq.com "bioinformatics" OR "computational biology" OR "genomics" remote intern OR "research associate" OR junior'
    enabled: true

  - name: Ashby — Longevity / Drug Discovery
    query: 'site:jobs.ashbyhq.com "longevity" OR "aging" OR "drug discovery" OR "protein design" intern OR junior remote'
    enabled: true

  - name: Ashby — Life Sciences Data / CV
    query: 'site:jobs.ashbyhq.com "life sciences" OR "biomedical" "data" OR "computer vision" OR "image analysis" intern OR junior remote'
    enabled: true

  # -- Lever: bioinformatics --
  - name: Lever — Bioinformatics / Comp Bio
    query: 'site:jobs.lever.co "bioinformatics" OR "computational biology" OR "genomics" intern OR junior remote'
    enabled: true

  - name: Lever — Longevity / Biotech Research
    query: 'site:jobs.lever.co "longevity" OR "aging" OR "drug discovery" OR "synthetic biology" intern OR "research associate" remote'
    enabled: true

  # -- LinkedIn / broad aggregators --
  - name: LinkedIn — Bioinformatics Intern Remote
    query: '"bioinformatics intern" OR "bioinformatics internship" remote site:linkedin.com/jobs'
    enabled: true

  - name: LinkedIn — Computational Biology Intern Remote
    query: '"computational biology intern" OR "computational biology internship" remote site:linkedin.com/jobs'
    enabled: true

  - name: LinkedIn — Longevity Research Intern
    query: '"longevity research" OR "aging research" intern OR internship remote site:linkedin.com/jobs'
    enabled: true

  - name: LinkedIn — Part-time Bioinformatics Remote
    query: '"bioinformatics" "part-time" OR "part time" remote site:linkedin.com/jobs'
    enabled: true

  - name: LinkedIn — Contract Bioinformatics Remote
    query: '"bioinformatics" contract OR freelance remote site:linkedin.com/jobs'
    enabled: true

  - name: LinkedIn — Life Sciences Data Engineer Junior
    query: '"life sciences" "data engineer" OR "bioinformatics engineer" junior OR intern remote site:linkedin.com/jobs'
    enabled: true

  - name: LinkedIn — Computer Vision Life Sciences
    query: '"computer vision" "life sciences" OR "pathology" OR "cell imaging" OR "biological" intern OR junior remote site:linkedin.com/jobs'
    enabled: true

  # -- Specialized bio job boards --
  - name: Nature Jobs — Bioinformatics Remote
    query: 'site:nature.com/naturecareers "bioinformatics" OR "computational biology" remote intern OR junior'
    enabled: true

  - name: Science Careers — Bioinformatics
    query: 'site:sciencecareers.sciencemag.org "bioinformatics" OR "computational biology" remote intern'
    enabled: true

  - name: Biospace — Bioinformatics / Longevity
    query: 'site:biospace.com "bioinformatics" OR "computational biology" OR "longevity" remote intern OR junior'
    enabled: true

  - name: RemoteOK — Life Sciences / Bioinformatics
    query: 'site:remoteok.com "bioinformatics" OR "computational biology" OR "genomics" OR "life sciences"'
    enabled: true

  - name: WeWorkRemotely — Bioinformatics
    query: 'site:weworkremotely.com "bioinformatics" OR "computational biology" OR "genomics" OR "life sciences"'
    enabled: true

  - name: Himalayas — Bioinformatics Remote
    query: 'site:himalayas.app "bioinformatics" OR "computational biology" OR "genomics" OR "longevity" remote'
    enabled: true

  - name: YC Jobs — Biotech / Longevity Startups
    query: 'site:workatastartup.com "bioinformatics" OR "computational biology" OR "longevity" OR "drug discovery" remote intern OR junior'
    enabled: true

  - name: HN Who's Hiring — Bioinformatics / Biotech
    query: 'site:news.ycombinator.com "bioinformatics" OR "computational biology" OR "longevity" OR "aging" remote intern'
    enabled: true

  # -- NIH / government research --
  - name: USAJobs — Bioinformatics (NIH/NCI)
    query: 'site:usajobs.gov "bioinformatics" OR "computational biology" NIH OR NCI OR NCBI remote OR telework student intern'
    enabled: true

  # -- University research / academic postings --
  - name: University of Arizona — Research Opportunities
    query: '"university of arizona" "bioinformatics" OR "computational biology" intern OR "research assistant" remote OR online'
    enabled: true

  - name: Broad Institute — Student / Intern
    query: 'site:broadinstitute.org OR site:boards.greenhouse.io/broadinstitute "intern" OR "student" OR "research associate" remote'
    enabled: true

  - name: HHMI / Janelia — Student Internships
    query: 'site:janelia.org OR site:hhmi.org intern OR "summer research" "bioinformatics" OR "computational" OR "computer vision" remote OR virtual'
    enabled: true

  # -- Conservation / ecology (drone_fish_counts adjacent) --
  - name: Conservation Bio / Ecological CV
    query: '"conservation" OR "wildlife" "bioinformatics" OR "computer vision" OR "image analysis" intern OR remote research'
    enabled: true

  # -- Bioinformatics-specific job boards --
  - name: Bioinformatics.org — Jobs Board
    query: 'site:bioinformatics.org/jobs "remote" OR "telecommute" bioinformatics OR "computational biology" OR genomics'
    enabled: true

  - name: Science Careers — Junior / Analyst Roles Remote
    query: 'site:jobs.sciencecareers.org "bioinformatics" OR "computational biology" OR "genomics" "remote" junior OR analyst OR associate'
    enabled: true

  # -- LinkedIn: ongoing/junior remote roles (durability-focused) --
  - name: LinkedIn — Junior Bioinformatics Analyst Remote Ongoing
    query: '"bioinformatics analyst" OR "research analyst bioinformatics" OR "junior bioinformatics" OR "junior computational biologist" remote "full-time" site:linkedin.com/jobs'
    enabled: true

  - name: LinkedIn — Health Data Analyst Remote Ongoing
    query: '"health data analyst" OR "genomics analyst" OR "clinical data analyst" bioinformatics OR genomics remote "full-time" OR "part-time" site:linkedin.com/jobs'
    enabled: true

  # -- USAJobs: health data analyst and CDC roles --
  - name: USAJobs — Health Data Analyst Bioinformatics Remote
    query: 'site:usajobs.gov "health data analyst" OR "bioinformatics" OR "public health analyst" "remote" OR "telework" GS-5 OR GS-7 OR GS-9 OR student'
    enabled: true

  - name: USAJobs — CDC Public Health Data Remote
    query: 'site:usajobs.gov CDC "data analyst" OR "bioinformatics" OR "epidemiologist" OR "health informatics" "remote" OR "telework" GS-5 OR GS-7 OR Pathways intern'
    enabled: true

  # -- CRO and health tech ongoing remote roles --
  - name: LinkedIn — CRO Bioinformatics Data Remote
    query: '"Covance" OR "Labcorp" OR "ICON plc" OR "Syneos Health" OR "Parexel" OR "PPD" bioinformatics OR "data analyst" OR "clinical data" remote site:linkedin.com/jobs'
    enabled: true

  - name: LinkedIn — Health Tech Analytics Remote Junior
    query: '"Komodo Health" OR "Flatiron Health" OR "Veracyte" OR "Guardant Health" bioinformatics OR "data analyst" OR "research analyst" remote junior OR associate site:linkedin.com/jobs'
    enabled: true

  - name: LinkedIn — Payer PBM Health Analytics Remote
    query: '"Optum" OR "Humana" OR "CVS Health" OR "Cigna Evernorth" OR "Express Scripts" "data analyst" OR "bioinformatics" OR "health analytics" remote junior OR associate OR "entry level" site:linkedin.com/jobs'
